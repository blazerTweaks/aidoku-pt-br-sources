name: Build sources
on:
  push:
    branches:
      - main
    paths:
      - "sources/**"
      - "templates/**"
      - ".github/workflows/build.yaml"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sources/pt-br.lermangas
            sources/pt-br.mangaflix
            sources/pt-br.ninjacomics
            sources/pt-br.tsundoku
      - name: Cache aidoku-cli
        id: cache-aidoku
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/aidoku
          key: aidoku-cli-${{ runner.os }}-v1
      - name: Install aidoku-cli
        if: steps.cache-aidoku.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/Aidoku/aidoku-rs aidoku-cli
      - name: Build sources
        run: |
          for src in ./sources/*; do
            (
              cd "$src"
              aidoku package
            )
          done
      - name: Build source list
        run: |
          aidoku build sources/*/package.aix --name "Aidoku PT-BR Sources"
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          branch: gh-pages
          folder: public
          git-config-name: GitHub Actions
          git-config-email: github-actions[bot]@users.noreply.github.com
          commit-message: Update source list
          single-commit: true
